name: CARTA Mobile Release

on:
  workflow_dispatch:
    inputs:
      build-tests:
        description: "Run flutter analyze and widget tests before building"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: carta-mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android release APK and AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Generate Android and iOS runners
        run: bash tool/bootstrap_platforms.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        if: ${{ inputs.build-tests != false }}
        run: flutter analyze --fatal-infos

      - name: Widget tests
        if: ${{ inputs.build-tests != false }}
        run: flutter test

      - name: Decode Play Store upload keystore (when configured)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "ANDROID_KEYSTORE_B64 is not configured - building a debug-signed release for sideload testing."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > android/app/release.keystore
          cat > android/key.properties <<KEYS
          storeFile=release.keystore
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          KEYS
          echo "Play Store upload keystore decoded - release builds will be signed with it."

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: carta-android-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: carta-android-release-aab
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 90
          if-no-files-found: error

      - name: Build summary
        shell: bash
        run: |
          SIGNING="debug-signed (sideloadable test build - do not ship to stores)"
          if [ -f android/key.properties ]; then
            SIGNING="signed with the Play Store upload keystore"
          fi
          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          ## CARTA Android release

          - APK artifact: \`carta-android-release-apk\`
          - AAB artifact: \`carta-android-release-aab\`
          - Signing: $SIGNING
          - Install (test builds): enable "Install unknown apps" for your browser or file manager, then open the downloaded app-release.apk.
          - Play Store: upload the signed AAB in the Google Play Console when the upload keystore is configured.
          SUMMARY

  ios:
    name: iOS unsigned release archive
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Generate Android and iOS runners
        run: bash tool/bootstrap_platforms.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build unsigned iOS release archive
        run: flutter build ipa --release --no-codesign || flutter build ios --release --no-codesign

      - name: Collect unsigned archive
        run: |
          set -e
          rm -rf build/ios/release-out
          mkdir -p build/ios/release-out
          if compgen -G "build/ios/archive/*.xcarchive" > /dev/null; then
            cp -R build/ios/archive/*.xcarchive build/ios/release-out/
          fi
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            cp -R build/ios/iphoneos/Runner.app build/ios/release-out/
          fi
          ls -la build/ios/release-out

      - name: Upload unsigned iOS archive
        uses: actions/upload-artifact@v4
        with:
          name: carta-ios-unsigned-archive
          path: apps/mobile/build/ios/release-out
          retention-days: 90
          if-no-files-found: error

      - name: Build summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          ## CARTA iOS (unsigned release archive)

          Apple requires a paid Apple Developer Program membership before an iOS app can be
          installed on real devices or uploaded to TestFlight. This job verifies the release
          build compiles and stores the unsigned .xcarchive artifact
          \`carta-ios-unsigned-archive\` (90-day retention).

          Next steps once you enroll ($99/yr, no Mac needed - GitHub's macOS runners can sign):
          1. Enroll at developer.apple.com/programs and create an App Store Connect API key.
          2. Add signing secrets (API key, certificate and provisioning profile) to this repository.
          3. Extend this job with fastlane pilot or xcrun altool to sign and upload to TestFlight.
          SUMMARY
