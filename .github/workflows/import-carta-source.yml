name: Import CARTA source bundle

on:
  push:
    branches: [main]
    paths:
      - "transfer/parts/**"
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: carta-source-import
  cancel-in-progress: false

jobs:
  unpack-and-commit:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || startsWith(github.event.issue.title, 'CARTA SOURCE IMPORT')
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Import the source tree
        shell: bash
        run: |
          set -euo pipefail

          # A second run may be triggered by deleting the transfer chunks.
          if [[ -f .bundle-imported ]]; then
            echo "The CARTA bundle has already been imported."
            exit 0
          fi

          shopt -s nullglob
          parts=(transfer/parts/*.bin)
          if (( ${#parts[@]} == 0 )); then
            echo "No CARTA transfer chunks were found." >&2
            exit 1
          fi

          cat "${parts[@]}" > /tmp/carta-source.tar.xz
          mkdir -p /tmp/carta-extract
          tar -xJf /tmp/carta-source.tar.xz -C /tmp/carta-extract
          test -d /tmp/carta-extract/carta-upload

          # Overlay the prepared source tree while preserving the already
          # committed live Supabase Edge Function file.
          cp -a /tmp/carta-extract/carta-upload/. ./
          mkdir -p supabase/functions/carta-api
          git cat-file -e HEAD:supabase/functions/carta-api/index.ts
          git checkout HEAD -- supabase/functions/carta-api/index.ts

          touch .bundle-imported
          rm -rf transfer/parts
          git add --all

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import complete CARTA application source tree"
          git push
