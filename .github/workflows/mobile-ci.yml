name: CARTA Mobile CI

on:
  push:
    branches: [main, feature/flutter-native-clients]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-ci.yml"

permissions:
  contents: write

concurrency:
  group: carta-mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Flutter analyze, test and Android build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - name: Generate Android and iOS runners
        run: bash tool/bootstrap_platforms.sh
      - name: Resolve dependencies
        run: flutter pub get
      - name: Commit generated native runners and dependency lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/android apps/mobile/ios apps/mobile/pubspec.lock
          if git diff --cached --quiet; then
            echo "Native runners and Flutter lockfile are already committed."
          else
            git commit -m "chore(mobile): add generated Android and iOS runners"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Widget tests
        run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: carta-android-debug
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk

  ios:
    name: Flutter iOS build
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - name: Generate Android and iOS runners
        run: bash tool/bootstrap_platforms.sh
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build iOS without signing
        run: flutter build ios --no-codesign
