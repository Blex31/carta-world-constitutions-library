name: CARTA Mobile CI

on:
  push:
    branches: [main, feature/flutter-native-clients]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-ci.yml"

permissions:
  contents: read

concurrency:
  group: carta-mobile-ci-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Flutter analyze, test and Android build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - name: Generate Android and iOS runners
        run: bash tool/bootstrap_platforms.sh
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Widget tests
        run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: carta-android-debug
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk

  ios:
    name: Flutter iOS build
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - name: Generate Android and iOS runners
        run: bash tool/bootstrap_platforms.sh
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build iOS without signing
        run: flutter build ios --no-codesign
