name: CARTA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: carta-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Audit data coverage
        run: npm run audit:coverage
      - name: Audit global constitution collection queue
        run: npm run audit:global-queue

      - name: Check JavaScript syntax
        run: npm run syntaxcheck

      - name: Type check
        run: npm run typecheck

      - name: Build production frontend
        run: npm run build
